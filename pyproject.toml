[tool.poetry]
name = "lesson-studio"
version = "0.1.0"
description = "Audio and timing service for scripted lesson beats"
authors = ["Little Learners Tech <contact@littlelearners.tech>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.128"
uvicorn = "^0.38.0"
httpx = "^0.28.1"
pydantic-settings = "^2.6.0"
pydantic-ai = "^2.61.0"
playwright = "^1.49.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
